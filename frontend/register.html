<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevNotes - Cadastre-se</title>
    <script src="https://cdn.tailwindcss.com"></script>
<!-- É um framework de CSS baseado em utilitários (utility-first). Em vez de escrever classes semânticas personalizadas e escrever regras em ambientes sepadados, o mesmo fornece classes de baixo nível pré-existentes, que se aplica diretamente no HTML para montar o design dividido entre elementos-->
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <!-- CARD PRINCIPAL-->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-xl space-y-6">
        <!-- TEXTO/TÍTULO -->
        <h1 class="text-2xl font-black text-center bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">Criar Conta</h1>
        <!-- BLOCO COM ENTRADAS E BOTÃO DE ENVIO-->
        <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Seu e-mail" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
            <input type="password" id="regPassword" placeholder="Sua senha" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
            <button onclick="register()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition duration-200 text-sm">Cadastrar</button>
        </div>
        <!--Criação de parágrafo | Rodapé-->
        <p class="text-center text-xs text-slate-400">Já tem uma conta? <a href="/login.html" class="text-emerald-400 hover:underline">Faça login</a></p>
    </div>
    <!-- Função assíncrona ao clicar em registrar/cadastrar-->
    <!-- Qualquer seção de script é para informar a comunicação com o backend-->
    <script>
        async function register() {
            //Capturar os valores digitados nos inputs de email e senha através de ID.
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            // REQUISIÇÃO HTTP DO TIPO POST PAR A API REGISTRO.
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                //Converte os dados para uma string JSON no corpo da requisição
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                alert('Conta criada com sucesso!');
                window.location.href = '/login.html';
                //Redireciona para a página de login.
            } else {
                const data = await res.json();
                alert(data.detail || 'Erro ao cadastrar');
                //Exibe a mensagem de retorno padronizada;
            }
        }
    </script>
</body>
</html>
