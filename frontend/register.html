<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevNotes - Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-xl space-y-6">
        <h1 class="text-2xl font-black text-center bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">Criar Conta</h1>
        <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Seu e-mail" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
            <input type="password" id="regPassword" placeholder="Sua senha" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-sm">
            <button onclick="register()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg transition duration-200 text-sm">Cadastrar</button>
        </div>
        <p class="text-center text-xs text-slate-400">Já tem uma conta? <a href="/login.html" class="text-emerald-400 hover:underline">Faça login</a></p>
    </div>
    <script>
        async function register() {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                alert('Conta criada com sucesso!');
                window.location.href = '/login.html';
            } else {
                const data = await res.json();
                alert(data.detail || 'Erro ao cadastrar');
            }
        }
    </script>
</body>
</html>
