server {
    # Define a porta em que o servidor Nginx vai escutar as requisições HTTP recebidas (porta padrão 80)
    listen 80;

    # Bloco de configuração para lidar com o tráfego principal da aplicação (frontend e arquivos estáticos)
    location / {
        # Define o diretório raiz no container onde estão armazenados os arquivos HTML do projeto
        root   /usr/share/nginx/html;
        
        # Define a ordem de prioridade dos arquivos padrão a serem exibidos quando a raiz for acessada
        index  login.html index.html index.htm;
        
        # Tenta encontrar o arquivo ($uri) ou diretório ($uri/) exato solicitado; se não encontrar, redireciona para o index.html (padrão em SPAs)
        try_files $uri $uri/ /index.html;
    }

    # Bloco de configuração para o proxy reverso direcionado às rotas de API
    location /api/ {
        # Encaminha todas as requisições iniciadas com /api/ para o serviço backend rodando na porta 8000
        proxy_pass http://backend:8000/api/;
        
        # Preserva o cabeçalho Host original do cliente na requisição repassada
        proxy_set_header Host $host;
        
        # Repassa o endereço IP real do cliente para o backend conseguir identificá-lo
        proxy_set_header X-Real-IP $remote_addr;
        
        # Acumula o histórico de IPs caso a requisição passe por múltiplos proxies intermediários
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}