<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DevNotes - Bloco de Notas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">DevNotes</h1>
                <p class="text-slate-400 text-sm">Gerenciador inteligente de anotações técnicas.</p>
            </div>
            <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">Sair</button>
        </header>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-slate-200">Criar Nova Nota</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="noteTitle" placeholder="Título da Nota" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm">
                <input type="text" id="noteCategory" placeholder="Categoria" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm">
            </div>
            <textarea id="noteContent" rows="3" placeholder="Escreva o conteúdo..." class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm"></textarea>
            <button onclick="createNote()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-lg text-sm">Salvar Nota</button>
        </div>

        <div class="space-y-4">
            <h2 class="text-lg font-bold text-slate-200">Suas Notas</h2>
            <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        async function fetchNotes() {
            const res = await fetch('/api/notes', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401) return logout();
            const notes = await res.json();
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';

            if (notes.length === 0) {
                grid.innerHTML = '<p class="text-slate-500 text-sm col-span-2">Nenhuma nota cadastrada.</p>';
                return;
            }

            notes.forEach(note => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex flex-col justify-between space-y-3">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-slate-100 text-base">${note.title}</h3>
                                <span class="text-xs px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full">${note.category}</span>
                            </div>
                            <p class="text-slate-400 text-xs whitespace-pre-line">${note.content}</p>
                        </div>
                        <button onclick="deleteNote(${note.id})" class="self-end text-xs text-rose-400 hover:text-rose-300">Excluir</button>
                    </div>
                `;
            });
        }

        async function createNote() {
            const title = document.getElementById('noteTitle').value;
            const category = document.getElementById('noteCategory').value;
            const content = document.getElementById('noteContent5')?.value || document.getElementById('noteContent').value;

            if (!title || !content) return alert('Preencha título e conteúdo.');

            await fetch('/api/notes', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ title, category: category || 'Geral', content })
            });

            document.getElementById('noteTitle').value = '';
            document.getElementById('noteCategory').value = '';
            document.getElementById('noteContent').value = '';
            fetchNotes();
        }

        async function deleteNote(id) {
            await fetch(`/api/notes/${id}`, { 
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            fetchNotes();
        }

        fetchNotes();
    </script>
</body>
</html>
